<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Gaming Dashboard</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #1e3c72, #2a5298, #4facfe);
  color: white;
}
nav {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  background: rgba(0,0,0,0.3);
}
nav button {
  background: #00c6ff;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
}
.container { padding: 20px; }
.card {
  background: rgba(255,255,255,0.1);
  padding: 15px;
  border-radius: 15px;
  margin: 10px 0;
  transition: 0.3s;
}
.card:hover { transform: scale(1.03); }
input, textarea, select {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 8px;
  border: none;
}
.progress {
  height: 8px;
  background: rgba(255,255,255,0.2);
  border-radius: 5px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: #00c6ff;
}
</style>
</head>
<body>

<nav>
  <div>🎮 W's Gaming Dashboard</div>
  <div>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('about')">About</button>
    <button onclick="showPage('contact')">Contact</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">

<div id="loginPage" class="card">
  <h2>Login / Sign Up</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<div id="homePage" style="display:none">
  <h2>Your Games</h2>
  <input id="gameName" placeholder="Game Name">
  <select id="status">
    <option>Playing</option>
    <option>Completed</option>
  </select>
  <input id="progress" type="number" placeholder="Progress % (0-100)">
  <button onclick="addGame()">Add Game</button>

  <div id="gamesList"></div>

  <h3>Comments</h3>
  <textarea id="commentInput"></textarea>
  <button onclick="addComment()">Post Comment</button>
  <div id="comments"></div>
</div>

<div id="aboutPage" style="display:none" class="card">
  <h2>About</h2>
  <p>HOLA!This is my gaming adventure so far and i keep it updated.Stay tuned!ADIOS.</p>
</div>

<div id="contactPage" style="display:none" class="card">
  <h2>Contact</h2>
  <p>Email: waleeydusman@gmail.com PHONE NO:+234 8162419282</p>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwQZnbDmZbGNqPhfJF2rHcfTyDnLXNJA0",
  authDomain: "gamingsite-a19ec.firebaseapp.com",
  projectId: "gamingsite-a19ec",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;
const ADMIN_EMAIL = "waleeydusman@gmail.com";

function signup(){ auth.createUserWithEmailAndPassword(email.value, password.value); }
function login(){ auth.signInWithEmailAndPassword(email.value, password.value); }
function logout(){ auth.signOut(); }

auth.onAuthStateChanged(user => {
  currentUser = user;
  if(user){
    loginPage.style.display = 'none';
    homePage.style.display = 'block';
    loadGames();
    loadComments();
  } else {
    loginPage.style.display = 'block';
    homePage.style.display = 'none';
  }
});

function showPage(page){
  homePage.style.display = 'none';
  aboutPage.style.display = 'none';
  contactPage.style.display = 'none';
  document.getElementById(page+'Page').style.display = 'block';
}

function addGame(){
  if(!currentUser) return;
  db.collection('games').add({
    uid: currentUser.uid,
    name: gameName.value,
    status: status.value,
    progress: Number(progress.value || 0)
  });
}

function loadGames(){
  db.collection('games').where('uid','==',currentUser.uid)
  .onSnapshot(snapshot => {
    gamesList.innerHTML = '';
    snapshot.forEach(doc => {
      let g = doc.data();
      gamesList.innerHTML += `
      <div class='card'>
        <b>${g.name}</b> - ${g.status}
        <div class='progress'>
          <div class='progress-bar' style='width:${g.progress}%'></div>
        </div>
        <small>${g.progress}%</small>
      </div>`;
    });
  });
}

function addComment(){
  if(!currentUser) return;
  db.collection('comments').add({
    text: commentInput.value,
    user: currentUser.email
  });
}

function loadComments(){
  db.collection('comments').onSnapshot(snapshot => {
    comments.innerHTML = '';
    snapshot.forEach(doc => {
      let c = doc.data();
      comments.innerHTML += `<div class='card'><b>${c.user}:</b> ${c.text}</div>`;
    });
  });
}
</script>

</body>
</html>
