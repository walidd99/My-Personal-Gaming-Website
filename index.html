<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gaming Profile</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.2.0/firebase-storage.js"></script>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
}

.profile {
  background: white;
  padding: 20px;
  text-align: center;
}

.profile img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid #4CAF50;
  object-fit: cover;
}

.container {
  padding: 20px;
}

.game {
  background: white;
  padding: 10px;
  margin: 10px 0;
  border-radius: 10px;
}

button {
  margin-top: 5px;
  cursor: pointer;
}

#loginBox {
  background: white;
  padding: 20px;
  width: 250px;
  margin: 20px auto;
  border-radius: 10px;
  text-align: center;
}
</style>
</head>

<body>

<!-- PROFILE -->
<div class="profile">
  <img id="profilePic" src="https://via.placeholder.com/120">
  <br><br>
  <input type="file" id="uploadPic">
  <button onclick="uploadProfilePic()">Upload</button>
  <h2>My Gaming Profile</h2>
</div>

<!-- LOGIN -->
<div id="loginBox">
  <h3>Admin Login</h3>
  <input type="email" id="email" placeholder="Email"><br><br>
  <input type="password" id="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
</div>

<!-- MAIN -->
<div class="container" id="mainContent" style="display:none;">

  <h3>Add Game</h3>
  <input id="gameName" placeholder="Game name">
  <select id="status">
    <option>Playing</option>
    <option>Completed</option>
  </select>
  <button onclick="addGame()">Add</button>

  <h3>Games</h3>
  <div id="games"></div>

</div>

<!-- COMMENTS (PUBLIC) -->
<div class="container">
  <h3>Comments (Public)</h3>
  <input id="commentInput" placeholder="Write comment">
  <button onclick="addComment()">Post</button>
  <div id="comments"></div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAwQZnbDmZbGNqPhfJF2rHcfTyDnLXNJA0",
  authDomain: "gamingsite-a19ec.firebaseapp.com",
  projectId: "gamingsite-a19ec",
  storageBucket: "gamingsite-a19ec.appspot.com",
  messagingSenderId: "1033184260885",
  appId: "1:1033184260885:web:51b172165059776030ef1c"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

/* LOGIN */
function login() {
  const email = email.value;
  const password = password.value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => {
      loginBox.style.display = "none";
      mainContent.style.display = "block";
      loadGames();
    })
    .catch(err => alert(err.message));
}

/* PROFILE PIC UPLOAD */
function uploadProfilePic() {
  const file = document.getElementById("uploadPic").files[0];
  if (!file) return alert("Select a file");

  const ref = storage.ref("profile.jpg");

  ref.put(file).then(() => {
    ref.getDownloadURL().then(url => {
      document.getElementById("profilePic").src = url;
    });
  });
}

/* ADD GAME */
function addGame() {
  const name = gameName.value;
  const status = document.getElementById("status").value;

  db.collection("games").add({ name, status });
  gameName.value = "";
}

/* LOAD GAMES */
function loadGames() {
  db.collection("games").onSnapshot(snapshot => {
    games.innerHTML = "";

    snapshot.forEach(doc => {
      const g = doc.data();

      games.innerHTML += `
        <div class="game">
          <b>${g.name}</b><br>
          Status: 
          <select onchange="updateStatus('${doc.id}', this.value)">
            <option ${g.status=="Playing"?"selected":""}>Playing</option>
            <option ${g.status=="Completed"?"selected":""}>Completed</option>
          </select>
          <br>
          <button onclick="deleteGame('${doc.id}')">Delete</button>
        </div>
      `;
    });
  });
}

/* UPDATE STATUS */
function updateStatus(id, status) {
  db.collection("games").doc(id).update({ status });
}

/* DELETE GAME */
function deleteGame(id) {
  db.collection("games").doc(id).delete();
}

/* COMMENTS (PUBLIC) */
function addComment() {
  const text = commentInput.value;
  db.collection("comments").add({ text });
  commentInput.value = "";
}

function loadComments() {
  db.collection("comments").onSnapshot(snapshot => {
    comments.innerHTML = "";
    snapshot.forEach(doc => {
      comments.innerHTML += `<p>${doc.data().text}</p>`;
    });
  });
}

loadComments();
</script>

</body>
</html>
