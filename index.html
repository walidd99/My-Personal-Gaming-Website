<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Gaming Dashboard</title>

<!-- Firebase JS SDK v12 (module version) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

  // NEW Firebase project config
  const firebaseConfig = {
    apiKey: "AIzaSyAyFmowaKfpL6Z8Kh2jI0SZvyFfcgv_hoA",
    authDomain: "gaming-project-87e12.firebaseapp.com",
    projectId: "gaming-project-87e12",
    storageBucket: "gaming-project-87e12.firebasestorage.app",
    messagingSenderId: "812020026158",
    appId: "1:812020026158:web:f2c8ba87abbb562eac48bf",
    measurementId: "G-019E81N6S0"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.signup = () => createUserWithEmailAndPassword(auth, email.value, password.value);
  window.login = () => signInWithEmailAndPassword(auth, email.value, password.value);
  window.logout = () => signOut(auth);

  let currentUser = null;
  const ADMIN_EMAIL = "waleeydusman@email.com";

  onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if(user){
      loginPage.style.display = 'none';
      homePage.style.display = 'block';
      loadGames();
      loadComments();
    } else {
      loginPage.style.display = 'block';
      homePage.style.display = 'none';
    }
  });

  window.showPage = (page) => {
    homePage.style.display = 'none';
    aboutPage.style.display = 'none';
    contactPage.style.display = 'none';
    document.getElementById(page+'Page').style.display = 'block';
  };

  window.addGame = async () => {
    if(!currentUser) return;
    await addDoc(collection(db, 'games'), {
      uid: currentUser.uid,
      name: gameName.value,
      status: status.value,
      progress: Number(progress.value || 0)
    });
  };

  window.loadGames = () => {
    const q = query(collection(db, 'games'), where('uid','==',currentUser.uid));
    onSnapshot(q, snapshot => {
      gamesList.innerHTML = '';
      snapshot.forEach(doc => {
        const g = doc.data();
        gamesList.innerHTML += `<div class='card'><b>${g.name}</b> - ${g.status}<div class='progress'><div class='progress-bar' style='width:${g.progress}%'></div></div><small>${g.progress}%</small></div>`;
      });
    });
  };

  window.addComment = async () => {
    if(!currentUser) return;
    await addDoc(collection(db, 'comments'), {
      text: commentInput.value,
      user: currentUser.email
    });
  };

  window.loadComments = () => {
    onSnapshot(collection(db, 'comments'), snapshot => {
      comments.innerHTML = '';
      snapshot.forEach(doc => {
        const c = doc.data();
        comments.innerHTML += `<div class='card'><b>${c.user}:</b> ${c.text}</div>`;
      });
    });
  };
</script>

<style>
body { margin: 0; font-family: Arial; background: linear-gradient(135deg, #1e3c72, #2a5298, #4facfe); color: white; }
nav { display: flex; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.3); }
nav button { background: #00c6ff; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
.container { padding: 20px; }
.card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 15px; margin: 10px 0; transition: 0.3s; }
.card:hover { transform: scale(1.03); }
input, textarea, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: none; }
.progress { height: 8px; background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden; }
.progress-bar { height: 100%; background: #00c6ff; }
</style>
</head>
<body>

<nav>
  <div>🎮 Walid's Gaming Dashboard</div>
  <div>
    <button onclick="showPage('home')">Home</button>
    <button onclick="showPage('about')">About</button>
    <button onclick="showPage('contact')">Contact</button>
    <button onclick="logout()">Logout</button>
  </div>
</nav>

<div class="container">
<div id="loginPage" class="card">
  <h2>Login / Sign Up</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="signup()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<div id="homePage" style="display:none">
  <h2>My Games</h2>
  <input id="gameName" placeholder="Game Name">
  <select id="status">
    <option>Playing</option>
    <option>Completed</option>
  </select>
  <input id="progress" type="number" placeholder="Progress % (0-100)">
  <button onclick="addGame()">Add Game</button>

  <div id="gamesList"></div>

  <h3>Comments</h3>
  <textarea id="commentInput"></textarea>
  <button onclick="addComment()">Post Comment</button>
  <div id="comments"></div>
</div>

<div id="aboutPage" style="display:none" class="card">
  <h2>About</h2>
  <p>HOLA!This is my gaming adventure so far.I update it soo stay tuned!ADIOS!!</p>
</div>

<div id="contactPage" style="display:none" class="card">
  <h2>Contact</h2>
  <p>Email: Waleeydusman@Gmail.com</p>
</div>

</body>
</html>
