<!DOCTYPE html>
<html>
<head>
  <title>Walid's Gaming List</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      color: white;
      text-align: center;
      background: linear-gradient(-45deg, #0f172a, #020617, #1e293b);
      background-size: 400% 400%;
      animation: bgMove 10s infinite alternate;
    }

    @keyframes bgMove {
      0% { background-position: left; }
      100% { background-position: right; }
    }

    header {
      padding: 20px;
      background: rgba(0,0,0,0.6);
    }

    .card {
      background: rgba(30,41,59,0.9);
      margin: 20px auto;
      padding: 20px;
      width: 90%;
      border-radius: 12px;
    }

    button {
      padding: 10px;
      margin: 5px;
      background: #22c55e;
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    input {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: none;
    }

    .hidden { display: none; }

    .game-card {
      background: #020617;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
    }

    img.game-img {
      width: 100px;
      border-radius: 8px;
    }

    /* PROFILE IMAGE STYLE */
    #profilePic {
      width: 120px;
      border-radius: 50%;
      border: 3px solid #22c55e;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  🎮 Walid's Gaming List <br>
  <button onclick="showPage('home')">Home</button>
  <button onclick="showPage('stats')">Stats</button>
</header>

<!-- PROFILE IMAGE -->
<img id="profilePic" src="IMG_8701.JPG" alt="Profile Picture">

<!-- CHANGE PROFILE PICTURE -->
<div class="card">
  <h3>Change Profile Picture</h3>
  <input type="file" id="profileInput" accept="image/*">
  <button onclick="changeProfile()">Upload</button>
</div>

<!-- HOME -->
<div id="home" class="card">
  <h1>Walid</h1>
  <p>Welcome to your upgraded gaming site 🔥</p>
</div>

<!-- STATS -->
<div id="stats" class="card hidden">
  <h2>📊 Game Tracker</h2>

  <input id="name" placeholder="Game name">
  <input id="hours" type="number" placeholder="Hours">
  <input id="image" placeholder="Image URL">

  <br>
  <button onclick="addGame()">Add Game</button>

  <div id="list"></div>
</div>

<script>
  function showPage(page) {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("stats").classList.add("hidden");
    document.getElementById(page).classList.remove("hidden");
  }

  // LOAD SAVED DATA
  window.onload = function() {
    // Load games
    let savedGames = JSON.parse(localStorage.getItem("games")) || [];
    savedGames.forEach(g => displayGame(g));

    // Load profile picture
    let savedPic = localStorage.getItem("profilePic");
    if (savedPic) {
      document.getElementById("profilePic").src = savedPic;
    }
  };

  // CHANGE PROFILE PICTURE FUNCTION
  function changeProfile() {
    const input = document.getElementById("profileInput");
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById("profilePic").src = e.target.result;
      localStorage.setItem("profilePic", e.target.result); // save to localStorage
    };
    reader.readAsDataURL(file);
  }

  // GAME STATS
  function addGame() {
    let name = document.getElementById("name").value;
    let hours = document.getElementById("hours").value;
    let image = document.getElementById("image").value;

    if (!name || !hours) return;

    let game = { name, hours, image };

    let saved = JSON.parse(localStorage.getItem("games")) || [];
    saved.push(game);
    localStorage.setItem("games", JSON.stringify(saved));

    displayGame(game);

    document.getElementById("name").value = "";
    document.getElementById("hours").value = "";
    document.getElementById("image").value = "";
  }

  function displayGame(game) {
    let list = document.getElementById("list");

    let div = document.createElement("div");
    div.className = "game-card";

    div.innerHTML = `
      <h3>${game.name}</h3>
      <p>${game.hours} hrs played</p>
      ${game.image ? `<img src="${game.image}" class="game-img">` : ""}
    `;

    list.appendChild(div);
  }
</script>

</body>
</html>
